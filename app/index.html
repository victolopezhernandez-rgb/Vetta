function captureForm(s){
  if(!s||s.type!=="plantForm") return;
  const v=id=>{const e=$(id);return e?e.value:undefined;}, r=n=>{const e=document.querySelector(`input[name="${n}"]:checked`);return e?e.value:undefined;};
  Object.assign(s.data,{name:v("#pf-name"),room:v("#pf-room"),light:r("pf-light")||s.data.light,pot:r("pf-pot")||s.data.pot,last:r("pf-last")||s.data.last});
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.tagName==="INPUT") return; // los inputs usan change/input
  const a=ACT[el.dataset.act]; if(!a) return;
  if(el.dataset.act!=="sheet-bg") e.preventDefault();
  a(el.dataset,el,e);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="photo-input"){ handlePhoto(el.files&&el.files[0]); return; }
  const act=el.dataset&&el.dataset.act;
  if(act==="auto-field"){ const p=plantById(el.dataset.id), cfg=autoCfg(p), f=el.dataset.f;
    if(el.type==="checkbox") cfg[f]=el.checked; else cfg[f]=clamp(+el.value,+el.min,+el.max);
    if(f==="on"&&el.checked&&S.autoStopped) toast("El riego automático está detenido. Reanúdalo arriba.");
    if(f==="confirm"||f==="threshold") S.pending=S.pending.filter(x=>x.plantId!==p.id);
    save(); R.lastAutoEval=0; render(); return; }
  if(act&&ACT[act]&&el.tagName==="INPUT") ACT[act](el.dataset,el,e);
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="sp-search"){ R.sheet.q=el.value; const pos=el.selectionStart; renderSheet(); const n=$("#sp-search"); if(n){n.focus();n.setSelectionRange(pos,pos);} return; }
  if(el.id==="chat-input"){ R.chat.draft=el.value; el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,140)+"px"; return; }
  if(el.dataset&&el.dataset.act==="auto-draft"&&R.sheet&&R.sheet.draft){ R.sheet.draft[el.dataset.f]=+el.value; const o=$(`#o-${el.id}`); if(o) o.textContent=el.value+el.dataset.u; }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&R.sheet) closeSheet();
  if(e.target.id==="chat-input"&&e.key==="Enter"&&!e.shiftKey&&window.matchMedia("(pointer:fine)").matches){ e.preventDefault(); sendChat(e.target.value); }
});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="composer"){ sendChat($("#chat-input").value); return; }
  if(f.id==="plant-form"){
    const s=R.sheet; captureForm(s); const d=s.data;
    const name=(d.name||"").trim(); if(!name){ $("#pf-name").focus(); toast("Ponle un nombre a tu planta."); return; }
    if(s.editId){
      const p=plantById(s.editId); Object.assign(p,{name,room:(d.room||"").trim(),light:d.light,pot:d.pot,speciesId:d.speciesId});
      if(s.photoNew){ if(p.photo)deletePhoto(p.photo); p.photo=s.photoNew; }
      save(); closeSheet(); render(); toast("Cambios guardados."); return;
    }
    const p={id:uid(),name,speciesId:d.speciesId,room:(d.room||"").trim(),light:d.light||"media",pot:d.pot||"mediana",createdAt:now(),remind:true};
    if(s.photoNew) p.photo=s.photoNew;
    else if(s.photoPending){ const id=uid(); savePhoto(id,s.photoPending); p.photo=id; }
    S.plants.push(p);
    const ago={hoy:0,pocos:3,semana:7}[d.last||"pocos"];
    if(ago!==undefined) S.logs.push({id:uid(),plantId:p.id,type:"riego",at:now()-ago*DAY,ml:doseFor(p),text:ago?"Riego aproximado (al agregar la planta)":undefined});
    if(S.flow&&S.flow.step==="plants"){ save(); closeSheet(); render(); toast(`${p.name} ya está en tu lista. ¿Tienes otra? Tómale una foto.`); return; }
    S.onboarded=true; save(); closeSheet(); R.tab="plantas"; R.plantId=p.id; render(); window.scrollTo(0,0); toast(`${p.name} ya está en tu jardín.`); return;
  }
  if(f.id==="water-form"){ const p=plantById(R.sheet.id); const ml=clamp(Math.round(+$("#w-ml").value||0),0,5000); const note=$("#w-note").value.trim();
    doWater(p,ml,"riego",note||undefined); save(); closeSheet(); render(); toast("Riego registrado."); return; }
  if(f.id==="ai-key-form"){
    const k=$("#ai-key").value.trim(); if(!k){ $("#ai-key").focus(); return; }
    if(!/^sk-[\w-]{20,}$/.test(k)){ toast("Eso no parece una API key de OpenAI (empieza con «sk-»)."); return; }
    try{ localStorage.setItem(LS_AIKEY,k); }catch(e){ toast("Este navegador no permite guardar la key."); return; }
    applyAI(); R.sampleChecked=true; renderSheet(); render(); toast("Key guardada. Ahora el asistente usa OpenAI."); return;
  }
  if(f.id==="note-form"){ const t=$("#n-text").value.trim(); if(!t)return; S.logs.push({id:uid(),plantId:R.sheet.id,type:"nota",at:now(),text:t}); save(); closeSheet(); render(); toast("Nota guardada."); return; }
  if(f.id==="fb-form"){
    const r=n=>{const e=document.querySelector(`input[name="${n}"]:checked`);return e?+e.value:null;};
    const pay=document.querySelector('input[name="fb-pay"]:checked');
    const entry={at:now(),ratings:{facil:r("fb-facil"),util:r("fb-util"),conf:r("fb-conf")},good:$("#fb-good").value.trim(),bad:$("#fb-bad").value.trim(),pay:pay?pay.value:"",level:S.plan,quiz:S.quiz||null,plants:S.plants.length,screen:R.tab,v:VERSION};
    if(!entry.ratings.facil&&!entry.ratings.util&&!entry.ratings.conf&&!entry.good&&!entry.bad){ toast("Responde al menos una pregunta."); return; }
    const btn=f.querySelector("button[type=submit]"); btn.disabled=true; btn.textContent="Enviando…";
    let ok=false;
    if(R.db&&R.uid){ try{ const ref=R.db.doc(`feedback/${R.uid}`); const snap=await ref.get(); const entries=snap.exists?[...(snap.data().entries||[])]:[]; entries.push(entry); await ref.set({entries:entries.slice(-30),updatedAt:now()}); ok=true; }catch(err){} }
    S.feedbackSent.push(entry.at); save();
    if(ok) openSheet({type:"feedback",done:true});
    else openSheet({type:"feedback",copy:`Opinión sobre la app (${VERSION})\nFacilidad: ${entry.ratings.facil||"—"}/5\nUtilidad: ${entry.ratings.util||"—"}/5\nConfianza: ${entry.ratings.conf||"—"}/5\nLe gustó: ${entry.good||"—"}\nCambiaría: ${entry.bad||"—"}\n¿Pagaría?: ${entry.pay||"—"}\nPlan: ${entry.level} · Plantas: ${entry.plants}`});
  }
});

// Búsqueda por nombre o descripción con Claude: primero intenta la lista; si no está, sugiere cuidados para guardarla aparte
const LIGHT_RANGE={baja:["baja","media"],media:["baja","media","alta"],alta:["media","alta","directa"],directa:["alta","directa"]};
async function lookupSpecies(s){
  const q=(s.q||"").trim(); if(!q) return;
  s.ai={q,status:"busy"}; renderSheet();
  const fail=msg=>{ if(R.sheet!==s||!s.ai||s.ai.q!==q) return; s.ai={q,status:"fail",msg}; renderSheet(); };
  if(!R.sample) return fail("La búsqueda con IA no está disponible en esta vista. Puedes guardarla con cuidados generales.");
  const list=SPECIES.filter(x=>x.id!=="otra").map(x=>`${x.id}: ${x.name} (${x.sci})${x.aka?" — "+x.aka.slice(0,4).join(", "):""}`).join("\n");
  const prompt=`Una persona quiere registrar una planta y la describe así, con sus palabras (puede ser un nombre común, regional, con errores de escritura o una descripción): «${q.slice(0,200)}»

Si corresponde a una de estas especies, usa su id exacto:
${list}

Si no está en la lista, usa "otra" e indica sus cuidados típicos en maceta.
Responde solo con JSON con esta forma exacta:
{"speciesId": "cafe", "confidence": "alta", "commonName": "Café", "sci": "Coffea arabica", "why": "Una frase breve en español explicando por qué.", "care": {"water": 5, "ideal": "alta", "moist": [40, 65], "temp": [18, 27], "hum": "Media", "pets": false, "diff": "Media", "shape": "ancha", "tip": "Un consejo breve en español."}}
- confidence: "alta", "media" o "baja". Si el texto no describe una planta, usa "otra" con confidence "baja" y explícalo en why.
- care solo es obligatorio si speciesId es "otra". water = días entre riegos (1 a 30). ideal: "baja", "media", "alta" o "directa". hum: "Baja", "Media" o "Alta". pets: true si es tóxica para mascotas, false si no, null si no se sabe. diff: "Muy fácil", "Fácil", "Media" o "Exigente". shape: "ancha", "espada", "roseta" o "colgante".`;
  try{
    const r=await R.sample.json(prompt)||{};
    if(R.sheet!==s||!s.ai||s.ai.q!==q) return;
    const ids=new Set(SPECIES.map(x=>x.id)), sid=ids.has(r.speciesId)?r.speciesId:"otra";
    const c=r.care||{}, num=(v,a,b,d)=>{ v=Math.round(+v); return isFinite(v)?clamp(v,a,b):d; };
    const pair=(v,a,b,d)=>Array.isArray(v)&&v.length===2?[num(v[0],a,b,d[0]),num(v[1],a,b,d[1])].sort((x,y)=>x-y):d;
    const care={water:num(c.water,1,30,7),ideal:LIGHT_RANGE[c.ideal]?c.ideal:"media",moist:pair(c.moist,5,90,[30,60]),temp:pair(c.temp,0,40,[16,28]),
      hum:["Baja","Media","Alta"].includes(c.hum)?c.hum:"Media",pets:c.pets===true?true:c.pets===false?false:null,
      diff:["Muy fácil","Fácil","Media","Exigente"].includes(c.diff)?c.diff:"Media",shape:["ancha","espada","roseta","colgante"].includes(c.shape)?c.shape:"ancha",
      tip:String(c.tip||"Observa la tierra antes de regar: si está húmeda, espera unos días.").slice(0,200)};
    const commonName=String(r.commonName||q).slice(0,40);
    if(sid==="otra"&&r.confidence==="baja") return fail(String(r.why||"No reconocimos esa planta.").slice(0,300)+" Prueba con otro nombre o guárdala con cuidados generales.");
    s.ai={q,status:"done",res:{speciesId:sid,commonName,sci:String(r.sci||"").slice(0,60),why:String(r.why||"").slice(0,300),care}};
    renderSheet();
  }catch(e){
    if(e&&(e.code==="not_granted"||e.code==="sampling_disabled")) R.sample=null;
    fail(SAMPLE_ERR[e&&e.code]||"No pudimos buscarla ahora. Intenta de nuevo o guárdala con cuidados generales.");
  }
}

// Reconocimiento de especie con Claude; si no está disponible, se elige de la lista con la foto ya guardada
async function identifyPlant(s,blob){
  const fail=msg=>{ if(R.sheet!==s) return; s.status="fail"; s.msg=msg; renderSheet(); };
  if(!R.sample||!R.imgOK) return fail("El reconocimiento por foto necesita una API key de OpenAI: pégala en Ajustes → Inteligencia artificial. Mientras tanto, elige la especie de la lista; tu foto se guarda igual.");
  const list=SPECIES.filter(x=>x.id!=="otra").map(x=>`${x.id}: ${x.name} (${x.sci})`).join("\n");
  const prompt=`Identifica la planta de la foto (puede ser de interior, de huerta o de jardín). Elige la especie de esta lista usando su id exacto, o "otra" si no está en la lista:
${list}

Responde solo con JSON con esta forma exacta:
{"isPlant": true, "speciesId": "poto", "confidence": "alta", "commonName": "Poto", "why": "Una frase breve en español sobre los rasgos que viste.", "alternatives": ["filodendro"]}
- isPlant: false si la foto no muestra una planta.
- confidence: "alta", "media" o "baja".
- commonName: nombre común en español (importante si speciesId es "otra").
- alternatives: de 0 a 2 ids de la lista que también podrían ser, distintos de speciesId.`;
  try{
    const r=await R.sample.json(prompt,{images:[blob]})||{};
    if(R.sheet!==s) return;
    const ids=new Set(SPECIES.map(x=>x.id)), sid=ids.has(r.speciesId)?r.speciesId:"otra";
    s.res={isPlant:r.isPlant!==false,speciesId:sid,confidence:["alta","media","baja"].includes(r.confidence)?r.confidence:"media",
      commonName:String(r.commonName||"").slice(0,60),why:String(r.why||"").slice(0,300),
      alternatives:(Array.isArray(r.alternatives)?r.alternatives:[]).filter(a=>ids.has(a)&&a!=="otra"&&a!==sid).slice(0,2)};
    s.status="done"; renderSheet();
  }catch(e){
    if(e&&(e.code==="not_granted"||e.code==="sampling_disabled")) R.sample=null;
    const why=e&&SAMPLE_ERR[e.code]&&e.code!=="server"?SAMPLE_ERR[e.code]:"No pudimos reconocerla ahora.";
    fail(why+(e&&e.detail?` (Detalle de OpenAI: ${e.detail})`:"")+" Elige la especie de la lista; tu foto se guarda igual.");
  }
}

async function handlePhoto(file){
  if(!file||!R.photoTarget) return;
  if(!/^image\//.test(file.type)){ toast("Elige un archivo de imagen."); return; }
  let out; try{ out=await compressImage(file); }catch(e){ toast("No pudimos abrir esa imagen. Prueba con otra."); return; }
  const t=R.photoTarget; R.photoTarget=null;
  if(t.kind==="identify"){ const s={type:"identify",status:"loading",photo:out.dataUrl}; openSheet(s); identifyPlant(s,out.blob); return; }
  if(t.kind==="form"){ const id=uid(); savePhoto(id,out.dataUrl); const s=R.sheet; if(s&&s.type==="plantForm"){ s.photoNew=id; s.photo=out.dataUrl; renderSheet(); } return; }
  if(t.kind==="log"){ const p=plantById(t.id); const id=uid(); savePhoto(id,out.dataUrl); S.logs.push({id:uid(),plantId:p.id,type:"foto",at:now(),photo:id}); if(!p.photo)p.photo=id; save(); render(); toast("Foto agregada al diario."); return; }
  if(t.kind==="chat"){ R.chat.attach={url:out.dataUrl,blob:out.blob}; render(); const i=$("#chat-input"); if(i) i.focus(); }
}

/* ───────── Render ───────── */
function getTheme(){ try{ return localStorage.getItem(LS_THEME)==="light"?"light":"dark"; }catch(e){ return "dark"; } }
function applyTheme(t){ document.documentElement.dataset.theme=t; }
function render(){
  const view=$("#view"), tabs=$("#tabs"), nav=$("nav.tabs"), chip=$("#plan-chip");
  const flow=inFlow(); document.body.classList.toggle("in-flow",flow);
  if(flow){
    view.dataset.v="flow-"+(S.flow?S.flow.step:"intro");
    view.innerHTML=viewFlow(); const bar=flowBar();
    tabs.className="col gut flow-bar"; tabs.innerHTML=bar; nav.style.display=bar?"":"none"; chip.hidden=true; return;
  }
  nav.style.display=""; tabs.className="col gut";
  if(!featureOf(R.tab)) R.tab="hoy";
  const f=featureOf(R.tab), fn={hoy:viewHoy,plantas:viewPlantas,asistente:viewAsistente,sensores:viewSensores,riego:viewRiego}[R.tab];
  view.dataset.v=S.plan<f[3]?"locked":R.tab==="plantas"&&R.plantId&&plantById(R.plantId)?"plant":R.tab;
  view.innerHTML=S.plan<f[3]?viewLocked(f):fn();
  tabs.innerHTML=FEATURES.map(([k,l,i,min])=>{ const lk=S.plan<min;
    return `<button class="tab-b${lk?" locked":""}" data-act="go" data-tab="${k}" ${R.tab===k?'aria-current="page"':""} ${lk?`aria-label="${l}, no incluido en tu plan"`:""}>${ic(i,22)}${l}${lk?`<span class="lk">${ic("lock",12)}</span>`:""}</button>`; }).join("");
  chip.hidden=!S.plan; chip.textContent=`Plan ${S.plan}`;
  const ci=$("#chat-input"); if(ci&&R.chat.draft){ ci.style.height=Math.min(ci.scrollHeight,140)+"px"; }
}
$("#brand-name").innerHTML=wordmark();
applyTheme(getTheme());
render();
initRuntime();
setInterval(()=>{ if(!inFlow()&&!R.sheet&&(R.tab==="hoy"||R.tab==="riego")){ const before=S.logs.length+S.pending.length; evaluateAutomation(); if(S.logs.length+S.pending.length!==before) render(); } },60e3);
})();
</script>
