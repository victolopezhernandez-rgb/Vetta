<title>Vetta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..600;1,9..40,400&family=DM+Serif+Display&display=swap">
<style>
/* Layout: en celular, columna de 480px con pestañas abajo; en tablet, 720px; en escritorio (≥1100px), menú lateral y contenido a lo ancho. Verdes = estructura; rosados = detalles. */
:root{
  --forest:#2E541B; --olive:#98A752; --wine:#8C263E; --blush:#E0AEBA;
  --bg:#F1F3EA; --surface:#FFFFFF; --surface-2:#E8ECDC; --line:#D6DCC6;
  --ink:#1B2414; --ink-2:#4F5A45; --ink-3:#737E65;
  --primary:#2E541B; --on-primary:#F3F6EA; --primary-soft:#DFE7CF; --olive-ink:#5B6822;
  --accent:#8C263E; --accent-soft:#F8E8EC; --on-accent:#FFF6F8; --blush-c:#E0AEBA;
  --head-bg:#2E541B; --head-ink:#EEF2E2; --head-ink-2:#C3CF9C;
  --leaf-1:#2E541B; --leaf-2:#98A752; --pot:#E0AEBA; --pot-rim:#8C263E;
  --warn:#94570A; --warn-soft:#FBF0DC; --ok:#3F6E1F; --ok-soft:#E4EED5; --danger:#A3243B; --danger-soft:#F9E3E7;
  --shadow:0 1px 2px rgba(30,45,20,.06),0 8px 22px rgba(30,45,20,.07);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F150B; --surface:#182112; --surface-2:#212C19; --line:#2F3C25;
  --ink:#E7EDDC; --ink-2:#B3BEA4; --ink-3:#8A957D;
  --primary:#A9BB5E; --on-primary:#142009; --primary-soft:#2A3A1C; --olive-ink:#BCCB7A;
  --accent:#E78FA6; --accent-soft:#3B1B24; --on-accent:#2B0C15; --blush-c:#E0AEBA;
  --head-bg:#1C3311; --head-ink:#E8EFD8; --head-ink-2:#AABA7B;
  --leaf-1:#6A9443; --leaf-2:#AFC064; --pot:#D9A3B1; --pot-rim:#B9506A;
  --warn:#E7B159; --warn-soft:#3A2C12; --ok:#9DC66B; --ok-soft:#22341A; --danger:#F2899B; --danger-soft:#3E1820;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F150B; --surface:#182112; --surface-2:#212C19; --line:#2F3C25;
  --ink:#E7EDDC; --ink-2:#B3BEA4; --ink-3:#8A957D;
  --primary:#A9BB5E; --on-primary:#142009; --primary-soft:#2A3A1C; --olive-ink:#BCCB7A;
  --accent:#E78FA6; --accent-soft:#3B1B24; --on-accent:#2B0C15; --blush-c:#E0AEBA;
  --head-bg:#1C3311; --head-ink:#E8EFD8; --head-ink-2:#AABA7B;
  --leaf-1:#6A9443; --leaf-2:#AFC064; --pot:#D9A3B1; --pot-rim:#B9506A;
  --warn:#E7B159; --warn-soft:#3A2C12; --ok:#9DC66B; --ok-soft:#22341A; --danger:#F2899B; --danger-soft:#3E1820;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-weight:500;letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:480px;margin:0 auto;width:100%}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-ink)}
.top .col{display:flex;align-items:center;gap:10px;min-height:60px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;color:inherit;text-align:left}
.brand-mark{width:32px;height:28px;flex:none;color:var(--head-ink-2)}
.wordmark{font-family:var(--serif);font-weight:400;letter-spacing:0;line-height:1;white-space:nowrap}
.wordmark .t2,.wordmark .wm-dot{color:var(--blush)}
.brand-name{font-size:28px;transform:translateY(1px)}
.lockup{display:flex;align-items:center;gap:14px}
.lockup .brand-mark{width:58px;height:50px;color:var(--primary)}
.lockup .wordmark{font-size:54px;color:var(--ink)}
.lockup .wordmark .t2{color:var(--primary)}
.lockup .wordmark .wm-dot{color:var(--accent)}
.btn-feedback{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--blush-c);color:#5E1427;font-weight:500;font-size:14px;padding:7px 13px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:inherit}
.top .icon-btn:hover{background:rgba(255,255,255,.1)}

/* Contenido */
main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
.section-h h2{font-size:20px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.tiny{font-size:12.5px;color:var(--ink-3)}
.page-title{font-size:30px;letter-spacing:.01em}
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card h3{font-size:18px;font-weight:500}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.pink{background:var(--accent-soft);color:var(--accent)}
.tag.green{background:var(--primary-soft);color:var(--olive-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid transparent;padding:11px 18px;font-weight:500;font-size:15px;line-height:1.2;transition:transform .12s ease,background .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-soft{background:var(--primary-soft);color:var(--olive-ink)}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-danger-ghost{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-block{width:100%}
.btn-sm{padding:7px 13px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--olive-ink);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;align-items:center;gap:12px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* Bienvenida */
.welcome{display:flex;flex-direction:column;gap:18px;padding-top:4px}
.welcome .art{width:132px;height:132px;border-radius:50%;background:var(--primary-soft);align-self:flex-start;overflow:hidden}
.welcome h1{font-size:34px;letter-spacing:.005em}
.welcome .lead{font-size:17px;color:var(--ink-2);max-width:36ch}

/* Niveles */

/* Listas de tareas */
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:0}
.task:last-child{padding-bottom:0}
.thumb{width:52px;height:52px;border-radius:14px;flex:none;overflow:hidden;background:var(--primary-soft);display:grid;place-items:center;border:0;padding:0}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover;display:block}
.task .t-name{font-weight:500}
.task .t-sub{font-size:13.5px;color:var(--ink-2)}

/* Grid de plantas */
.plant-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.pcard .pic{aspect-ratio:1/1;max-width:100%;background:var(--primary-soft);position:relative}
.pcard .pic img,.pcard .pic svg{width:100%;height:100%;object-fit:cover;display:block}
.pcard .pic .tag{position:absolute;left:8px;top:8px}
.pcard .sensor-dot{position:absolute;right:9px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--olive-ink);display:grid;place-items:center}
.pcard .body{padding:10px 12px 13px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pcard .nm{font-weight:500;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sp{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-tile{border:1.5px dashed var(--line);background:transparent;border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--olive-ink);min-height:180px;font-weight:500}

/* Detalle */
.hero{border-radius:var(--r-lg);overflow:hidden;background:var(--primary-soft);aspect-ratio:4/3;max-width:100%;max-height:300px;width:100%;position:relative}
.hero img,.hero svg{width:100%;height:100%;object-fit:cover;display:block}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:4px 0;color:var(--olive-ink);font-weight:500}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--r-md);border:0;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:500;color:var(--ink)}
.quick button svg{color:var(--olive-ink)}
.big-num{font-size:34px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
details.why{margin-top:10px}
details.why summary{cursor:pointer;color:var(--olive-ink);font-weight:500;font-size:14px;list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.insight{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.insight:first-of-type{border-top:0}
.insight .ic{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--primary-soft);color:var(--olive-ink)}
.insight.aviso .ic{background:var(--warn-soft);color:var(--warn)}
.insight.alerta .ic{background:var(--danger-soft);color:var(--danger)}
.insight b{font-weight:500;display:block}
.insight p{font-size:14.5px;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:10px}
.facts div{min-width:0}
.facts dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.facts dd{margin:2px 0 0;font-size:15px}
.tip{margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--ink);font-size:14.5px}
.tip b{color:var(--accent);font-weight:500}
.timeline{display:flex;flex-direction:column}
.entry{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .ic{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--primary-soft);color:var(--olive-ink)}
.entry.auto .ic{background:var(--accent-soft);color:var(--accent)}
.entry .when{font-size:13px;color:var(--ink-3)}
.entry .txt{font-size:15px;overflow-wrap:anywhere}
.entry img{margin-top:8px;border-radius:12px;max-height:220px;width:auto;max-width:100%}
.entry .del{margin-left:auto;align-self:flex-start;background:none;border:0;color:var(--ink-3);padding:2px}

/* Demo / sensores */
.demo{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);font-size:14.5px}
.demo svg{color:var(--accent);flex:none;margin-top:2px}
.demo b{font-weight:500;color:var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.metric{background:var(--surface-2);border-radius:var(--r-sm);padding:10px;min-width:0;border:0;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px;box-shadow:inset 0 0 0 1.5px transparent;transition:background .15s,box-shadow .15s}
.metric .lbl{font-size:12.5px;line-height:1.25;color:var(--ink-3);font-weight:500}
.metric .val{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.metric.on{background:var(--primary-soft);box-shadow:inset 0 0 0 1.5px var(--primary)}
.metric.on .lbl{color:var(--olive-ink)}
.metric .val small{font-size:13px;color:var(--ink-2)}
.range{position:relative;height:8px;border-radius:4px;background:var(--surface-2);margin-top:10px}
.range .ideal{position:absolute;top:0;bottom:0;background:var(--primary-soft);border-radius:4px}
.range .mk{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--primary)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{fill:var(--ink-3);font-size:10px;font-family:var(--font)}

/* Riego */
.stop-card{display:flex;flex-direction:column;gap:12px}
.status-line{display:flex;align-items:center;gap:8px;font-size:14.5px}
.rule{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.rule label,.field label{font-size:14px;font-weight:500}
.rule .row{justify-content:space-between}
.rule output{font-variant-numeric:tabular-nums;color:var(--olive-ink);font-weight:500}
input[type=range]{width:100%;accent-color:var(--primary)}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;top:3px;left:3px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--primary)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pending{border:1.5px solid var(--accent);background:var(--surface)}
.mode-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-top:14px;border-radius:999px;background:var(--surface-2)}
.mode-seg button{border:0;background:transparent;border-radius:999px;padding:8px 10px;font-weight:500;font-size:14.5px;color:var(--ink-2)}
.mode-seg button[aria-checked="true"]{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.cfg-sum{padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2)}
.cfg-warn{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:9px 12px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.cfg-warn svg{flex:none;margin-top:2px}
.card-grid,.qgrid{display:flex;flex-direction:column;gap:16px}
.rec-a,.rec-b{display:flex;flex-direction:column;gap:10px}
.pending h3{color:var(--accent)}

/* Asistente */
.ctx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.ctx::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg img{display:block;max-width:180px;border-radius:12px;margin-bottom:6px}
.msg .acts{margin-top:8px;display:flex;gap:10px}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.suggest button{border:1px dashed var(--olive);background:transparent;border-radius:999px;padding:7px 13px;font-size:14px;color:var(--olive-ink);font-weight:500}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border-radius:24px;padding:6px;box-shadow:var(--shadow)}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;padding:9px 8px;min-height:42px;max-height:140px;outline:none;font-size:16px}
.composer .icon-btn{color:var(--olive-ink);flex:none}
.composer .send{background:var(--primary);color:var(--on-primary)}
.attach-prev{display:flex;align-items:center;gap:8px;font-size:13.5px}
.attach-prev img{width:44px;height:44px;object-fit:cover;border-radius:10px}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .col{display:grid;grid-template-columns:repeat(5,1fr)}
.tabs .tab-b{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;border:0;background:none;font-size:11.5px;font-weight:500;color:var(--ink-3);position:relative}
.tabs .tab-b[aria-current="page"]{color:var(--primary)}
.tabs .tab-b[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* Hojas (sheets) */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,22,10,.45)}
.sheet{width:100%;max-width:480px;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{font-size:23px;flex:1}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.field{display:flex;flex-direction:column;gap:6px}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 13px;font-size:16px;outline:none}
.input:focus{border-color:var(--olive)}
textarea.input{resize:vertical;min-height:84px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choice span{display:block;height:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;font-size:14.5px}
.choice span b{display:block;font-weight:500}
.choice span i{font-style:normal;font-size:12.5px;color:var(--ink-3)}
.choice input:checked+span{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sp-list{display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow-y:auto}
.sp-item{display:flex;align-items:center;gap:12px;padding:8px;border:0;background:none;border-radius:var(--r-sm);text-align:left}
.sp-item:hover{background:var(--surface)}
.sp-item .thumb{width:44px;height:44px;border-radius:12px}
.sp-item b{font-weight:500;display:block}
.sp-item i{font-size:13px;color:var(--ink-3)}

/* Búsqueda por nombre común: sin tildes ni mayúsculas, ignora «planta de», «mata de»… y tolera errores de tipeo */
const FILLER = new Set("planta plantas plantita mata matas matica matita arbol arbolito arbusto hierba mi mis la las el los un una unos unas de del con que y".split(" "));
const norm = t => String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").trim();
const words = t => { const w=norm(t).split(/\s+/).filter(Boolean), k=w.filter(x=>!FILLER.has(x)); return k.length?k:w; };
function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){ const cur=[i]; for(let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[b.length];
}
const cleanName = t => String(t||"").trim().replace(/^(?:(?:una?|el|la|mi)\s+)?(?:plantas?|plantita|matas?|matica|matita|árbol|arbol|arbolito|arbusto)\s+(?:de\s+(?:la\s+|el\s+)?)?/i,"").trim() || String(t||"").trim();
const near = (a,b) => a.length>=4 && lev(a,b) <= (a.length>=8?2:1);
function matchScore(qw,label){
  const lw=words(label), q=qw.join(" "), l=lw.join(" ");
  if(!q||!l) return 0;
  if(l===q) return 100;
  if(l.startsWith(q)) return 90;
  if(qw.every(w=>lw.some(x=>x.startsWith(w)))) return 80;
  if(q.length>=3&&l.includes(q)) return 60;
  if(near(q,l)) return 70;
  if(qw.every(w=>lw.some(x=>x===w||(w.length>=5&&x.length>=5&&near(w,x))))) return 55;
  return 0;
}
function searchSpecies(q){
  const qw=words(q); if(!qw.length) return null;
  const all=[...SPECIES.filter(x=>x.id!=="otra"),...(S.customSp||[])];
  return all.map((x,i)=>{
    let best=0, via="";
    [x.name,...(x.aka||[])].forEach((lab,k)=>{ const sc=matchScore(qw,lab); if(sc>best){ best=sc; via=k&&!norm(x.name).includes(norm(lab))?lab:""; } });
    const sc=matchScore(qw,x.sci)-5; if(sc>best){ best=sc; via=""; }
    return {x,best,via,i};
  }).filter(r=>r.best>0).sort((a,b)=>b.best-a.best||a.i-b.i);
}

    const sens=Object.keys(s.sensors); let l=s.plants.length?1:0;
    if(s.usedAssistant) l=2; if(sens.length) l=3; if(Object.values(s.auto).some(a=>a.on)) l=4;
    s.plan=s.onboarded||s.plants.length?Math.max(1,l):0;
    s.hw={skip:{},steps:sens.length?{charge:true,hub:true,rules:l>=4}:{},pumps:{}};
    if(sens.length) s.plants.forEach(p=>{ if(!s.sensors[p.id]) s.hw.skip[p.id]=true; else if(l>=4) s.hw.pumps[(p.room||"").trim()||"Sin lugar"]=true; });
    if(s.plants.length) s.onboarded=true;
  }
  s.hw=Object.assign({skip:{},steps:{},pumps:{}},s.hw);
  return s;
}

// IA con OpenAI (gpt-5.6-luna). La API key se pega en Ajustes y se guarda solo en este
// dispositivo (nunca en la página ni en la nube); sin key se usa Claude.
const AI_MODEL="gpt-5.6-luna", LS_AIKEY="vetta.openai";
const getAIKey=()=>{ try{return localStorage.getItem(LS_AIKEY)||"";}catch(e){return "";} };
const blobToDataURL=b=>new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=ko;fr.readAsDataURL(b);});
// Imita la interfaz de sample() para que el resto de la app no cambie
function openaiAI(){
  const call=async(input,opts={})=>{
    const messages=(typeof input==="string"?[{role:"user",content:input}]:input).map(m=>({role:m.role,content:m.content}));
    const images=opts.images&&opts.images.length?await Promise.all(opts.images.map(blobToDataURL)):[];
    if(images.length){ const last=messages[messages.length-1]; last.content=[{type:"text",text:last.content},...images.map(url=>({type:"image_url",image_url:{url}}))]; }
    // Los modelos que razonan gastan tokens antes de responder: se da margen y se reintenta
    // sin formato JSON forzado (o con más margen) si la primera respuesta falla o llega vacía.
    const send=async body=>{
      let r;
      try{ r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+getAIKey(),"Content-Type":"application/json"},body:JSON.stringify(body),signal:opts.signal}); }
      catch(e){ throw {code:e&&e.name==="AbortError"?"cancelled":"network"}; }
      const d=await r.json().catch(()=>({}));
      return {r,d,detail:String(d&&d.error&&d.error.message||"").slice(0,200)};
    };
    const body={model:AI_MODEL,messages,max_completion_tokens:opts.json?6000:3000};
    if(opts.json) body.response_format={type:"json_object"};
    let {r,d,detail}=await send(body);
    if(!r.ok&&r.status===400&&body.response_format){ delete body.response_format; ({r,d,detail}=await send(body)); }
    if(!r.ok) throw {code:r.status===401?"bad_key":r.status===404?"bad_model":r.status===429?"rate_limited":images.length&&r.status===400?"image_rejected":"server",detail};
    let c=d.choices&&d.choices[0], text=String(c&&c.message&&c.message.content||"");
    if(!text.trim()&&c&&c.finish_reason==="length"){
      body.max_completion_tokens*=2; ({r,d,detail}=await send(body));
      if(!r.ok) throw {code:r.status===429?"rate_limited":"server",detail};
      c=d.choices&&d.choices[0]; text=String(c&&c.message&&c.message.content||"");
    }
    if(!text.trim()) throw {code:"empty",detail:c&&c.message&&c.message.refusal?String(c.message.refusal).slice(0,200):""};
    if(opts.onText) opts.onText({text,delta:text});
    return {text,truncated:!!c&&c.finish_reason==="length"};
  };
  call.json=async(prompt,opts={})=>{
    const {text}=await call(prompt,{...opts,json:true});
    try{ return JSON.parse(text); }catch(e){ const m=text.match(/\{[\s\S]*\}/); if(m) try{ return JSON.parse(m[0]); }catch(e2){} throw {code:"bad_json"}; }
  };
  return call;
}

/* ───────── Lógica de cuidado (Plant Intelligence por reglas) ───────── */
const plantById = id=>S.plants.find(p=>p.id===id);
const logsOf = id=>S.logs.filter(l=>l.plantId===id).sort((a,b)=>b.at-a.at);
const waterings = id=>logsOf(id).filter(l=>l.type==="riego"||l.type==="auto");

function baseInterval(p){
  const sp=SP(p.speciesId);
  const lf={baja:1.25,media:1,alta:.85,directa:.75}[p.light]||1;
  const pf={pequena:.85,mediana:1,grande:1.2}[p.pot]||1;
  return Math.max(2,Math.round(sp.water*lf*pf));
}
function doseFor(p){ const sp=SP(p.speciesId); return Math.round((POT[p.pot]?.ml||250)*sp.mlf/10)*10; }

function waterPlan(p){
  const sp=SP(p.speciesId), days=baseInterval(p), ws=waterings(p.id), ml=doseFor(p);
  const why=[`${sp.id==="otra"?"Para una planta de interior típica":"La "+sp.name.toLowerCase()} se riega en promedio cada ${sp.water} días.`];
  if(p.light!=="media") why.push(`Está en luz ${LIGHT[p.light].label.toLowerCase()}: ${p.light==="baja"?"la tierra tarda más en secarse, así que espaciamos el riego":"la tierra se seca antes, así que acortamos el intervalo"}.`);
  if(p.pot!=="mediana") why.push(`Maceta ${POT[p.pot].label.toLowerCase()}: ${p.pot==="pequena"?"guarda menos agua":"guarda más agua"}.`);
  let conf = sp.id==="otra"?"baja":"media";
  if(ws.length>=3){
    const gaps=[];for(let i=0;i<Math.min(ws.length-1,5);i++)gaps.push((ws[i].at-ws[i+1].at)/DAY);
    const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    why.push(`Tus últimos riegos fueron cada ~${Math.max(1,Math.round(avg))} días.`);
    conf = sp.id==="otra"?"media":"alta";
  }
  const last=ws[0]?ws[0].at:null;
  let due, status, next=null;
  if(!last){ due=0; status="sin-dato"; why.push("Aún no hay riegos registrados: cuando registres el primero, calcularemos la fecha exacta."); conf="baja"; }
  else { next=sod(last)+days*DAY; due=dayDiff(now(),next); status= due<0?"atrasada":due===0?"hoy":"ok"; }
  const sens=sensorOn(p.id);
  let moist=null;
  if(sens){ moist=moistureAt(p,now()); conf="alta";
    if(moist==null){ why.push("El sensor no da una lectura válida ahora: usamos el calendario."); conf="media"; }
    else if(due<=0&&moist>sp.moist[0]+8){ status="espera"; why.push(`El sensor marca ${moist}% de humedad (ideal ${sp.moist[0]}–${sp.moist[1]}%): todavía puedes esperar.`); }
    else if(moist<sp.moist[0]){ if(due>0){status="hoy";due=0;} why.push(`El sensor marca ${moist}%, por debajo de lo ideal (${sp.moist[0]}%).`); }
  }
  return {days,due,status,next,last,ml,why,conf,moist};
}
function statusTag(plan){
  if(plan.status==="atrasada") return `<span class="tag bad"><span class="dot"></span>Atrasada ${-plan.due} d</span>`;
  if(plan.status==="hoy") return `<span class="tag warn"><span class="dot"></span>Regar hoy</span>`;
  if(plan.status==="sin-dato") return `<span class="tag pink"><span class="dot"></span>Sin registro</span>`;
  if(plan.status==="espera") return `<span class="tag green"><span class="dot"></span>Húmeda aún</span>`;
  return `<span class="tag ok"><span class="dot"></span>Riego ${inDays(plan.due)}</span>`;
}

function insights(p){

  if(!sp.light.includes(p.light)){
    const more = LIGHT_ORDER.indexOf(p.light)<LIGHT_ORDER.indexOf(sp.ideal);
    out.push({lv:"aviso",ic:"sun",t:more?"Le vendría bien más luz":"Puede estar recibiendo demasiada luz",

            :`La ${sp.name.toLowerCase()} prefiere luz ${LIGHT[sp.ideal].label.toLowerCase()}. El sol directo puede quemar sus hojas: aléjala un poco de la ventana o usa una cortina.`});
  }
  if(ws.length>=3){
    const gaps=[];for(let i=0;i<Math.min(ws.length-1,5);i++)gaps.push((ws[i].at-ws[i+1].at)/DAY);
    const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    if(avg<plan.days*.55) out.push({lv:"aviso",ic:"drop",t:"Puede que la estés regando de más",w:`La riegas cada ~${Math.round(avg)} días y recomendamos cada ${plan.days}. Antes de regar, toca la tierra: si está húmeda, espera.`});
    else if(avg>plan.days*1.8) out.push({lv:"info",ic:"drop",t:"Los riegos se están espaciando",w:`La riegas cada ~${Math.round(avg)} días y recomendamos cada ${plan.days}. Si notas hojas caídas o tierra muy seca, acorta el intervalo.`});
  }
  const notes=logsOf(p.id).filter(l=>l.type==="nota"&&now()-l.at<30*DAY).map(l=>(l.text||"").toLowerCase()).join(" ");
  const rules=[
    [/amarill/,"alerta","Hojas amarillas","Suele relacionarse con exceso de agua o mal drenaje. Revisa que la maceta tenga agujeros y que la tierra seque entre riegos. Puede tener otras causas (hojas viejas, falta de luz): si sigue, pregúntale al asistente con una foto."],
    [/(caf[eé]|marr[oó]n|puntas? seca|bordes? seco|quemad)/,"aviso","Puntas o bordes secos","Suele indicar aire seco, agua con mucho cloro o riegos irregulares. Prueba con agua reposada y aleja la planta de aire acondicionado o calefacción."],
    [/(ca[ií]d|mustia|desmay|triste|blanda|arrugad)/,"aviso","Hojas caídas o blandas","Puede ser sed o, al contrario, raíces encharcadas. Toca la tierra: si está seca, riega; si está mojada, espera y revisa el drenaje."],
    [/(plaga|bicho|insecto|mosquit|telara|ara[ñn]a|manchas? blanca|algod)/,"alerta","Posible plaga","Aísla la planta de las demás y limpia las hojas con agua y jabón potásico. Una foto al asistente ayuda a identificar el insecto."],
    [/(hongo|moho|podrid)/,"alerta","Posible exceso de humedad","El moho y la podredumbre aparecen con tierra siempre mojada. Deja secar más entre riegos y mejora la ventilación."]
  ];
  for(const [re,lv,t,w] of rules){ if(re.test(notes)) out.push({lv,ic:"alert",t:"Según tus notas: "+t.toLowerCase(),w}); }
  if(sensorOn(p.id)&&plan.moist!=null){
    if(plan.moist<sp.moist[0]) out.push({lv:"alerta",ic:"gauge",t:`Tierra seca: ${plan.moist}%`,w:`Lo ideal para esta planta es ${sp.moist[0]}–${sp.moist[1]}%. Riégala con unos ${plan.ml} ml.`});
    else if(plan.moist>sp.moist[1]+10) out.push({lv:"aviso",ic:"gauge",t:`Tierra muy húmeda: ${plan.moist}%`,w:`Lo ideal es ${sp.moist[0]}–${sp.moist[1]}%. No riegues hasta que baje.`});
    const tc=tempAt(p,now()); if(tc<sp.temp[0]||tc>sp.temp[1]) out.push({lv:"aviso",ic:"thermo",t:`Temperatura fuera de rango: ${tc} °C`,w:`Esta planta está cómoda entre ${sp.temp[0]} y ${sp.temp[1]} °C.`});
  }
  if(S.settings.pets&&sp.pets===false) out.push({lv:"aviso",ic:"paw",t:"Tóxica para mascotas",w:"Ubícala donde tu perro o gato no pueda morderla."});
  if(!ws.length) out.push({lv:"info",ic:"info",t:"Registra tus riegos para afinar los consejos",w:"Con 3 riegos registrados ya podemos comparar tu ritmo con lo que necesita la planta."});
  if(sp.id==="otra") out.push({lv:"info",ic:"camera",t:"Identifica la especie",w:"Por ahora usamos cuidados generales. Si sabes qué planta es, edítala; o envíale una foto al asistente."});
  return out;
}

/* ───────── Sensores simulados (demo) ───────── */
function moistureAt(p,t){
  const s=sensorOn(p.id); if(!s) return null;
  if(s.fault&&t>=s.fault) return null;
  const interval=baseInterval(p);
  const ws=waterings(p.id).filter(l=>l.at<=t);
  const w=ws[0]?ws[0].at:(p.createdAt-interval*.6*DAY);
  const dd=(t-w)/DAY, dry=interval*1.15;
  const m=84-(84-6)*Math.min(1,dd/dry);
  const noise=(hash(p.id+Math.floor(t/HOUR))%5)-2;
  return clamp(Math.round(m+noise),3,95);
}
function tempAt(p,t){
  const d=new Date(t), hr=d.getHours()+d.getMinutes()/60;
  const base=20.5+(hash(p.room||"sala")%3)*.6;
  const v=base+2.6*Math.sin((hr-9)/24*2*Math.PI)+((hash(p.id+Math.floor(t/HOUR))%7)-3)*.12;
  return Math.round(v*10)/10;
}
function lightAt(p,t){
  const d=new Date(t), hr=d.getHours()+d.getMinutes()/60;
  const peak={baja:250,media:1100,alta:3800,directa:16000}[p.light]||1000;
  const day=hr>6&&hr<18?Math.sin((hr-6)/12*Math.PI):0;
  return Math.round(peak*day*(.88+(hash(p.id+Math.floor(t/HOUR))%25)/100));
}
const fmtLux = v=>v>=1000?(Math.round(v/100)/10).toString().replace(".",",")+" k":String(v);

function sensorAlerts(){
  const out=[];
  for(const p of S.plants){ if(!sensorOn(p.id))continue; const sp=SP(p.speciesId), m=moistureAt(p,now());
    if(m==null) out.push({p,t:"Sensor sin lectura",w:"Revisa la conexión del sensor. El riego automático queda bloqueado mientras tanto.",lv:"alerta"});
    else if(m<sp.moist[0]) out.push({p,t:`Tierra seca (${m}%)`,w:`Ideal ${sp.moist[0]}–${sp.moist[1]}%.`,lv:"alerta"});
  }
  return out;
}

/* ───────── Riego automático: reglas fijas (la IA no acciona la bomba) ───────── */
/* Valores sugeridos según especie, maceta y luz. En modo «sugerido» se recalculan siempre;
   en «manual» solo cambian desde el editor, con confirmación. */
function autoSuggest(p){
  const sp=SP(p.speciesId);
  return {threshold:sp.moist[0],ml:Math.min(doseFor(p),HARD_MAX_ML),gapH:clamp(Math.round(baseInterval(p)*8/2)*2,12,48),maxDay:1};
}
function autoCfg(p){
  if(!S.auto[p.id]) S.auto[p.id]={on:false,mode:"sug",confirm:true,snoozeUntil:0};
  const cfg=S.auto[p.id];
  if(cfg.mode!=="manual"){ cfg.mode="sug"; Object.assign(cfg,autoSuggest(p)); }
  return cfg;
}
function autoWarnings(p,cfg){
  const sp=SP(p.speciesId), g=autoSuggest(p), w=[];
  if(cfg.threshold<sp.moist[0]-10) w.push(`Riega muy tarde: la tierra bajará de su ideal (${sp.moist[0]}–${sp.moist[1]} %).`);
  if(cfg.threshold>sp.moist[1]) w.push("Riega con la tierra aún húmeda: riesgo de pudrir raíces.");
  if(cfg.ml>g.ml*1.6) w.push(`Dosis alta para su maceta (sugerido ${g.ml} ml).`);
  if(cfg.gapH<g.gapH/2) w.push(`Espera corta entre riegos (sugerido ${g.gapH} h).`);
  if(cfg.maxDay>g.maxDay) w.push("Más de un riego al día casi nunca hace falta.");
  return w;
}
function addEvent(p,kind,text){
  const last=S.autoEvents.find(e=>e.plantId===p.id);
  if(last&&last.kind===kind&&kind!=="riego"&&now()-last.at<6*HOUR) return false;
  S.autoEvents.unshift({id:uid(),plantId:p.id,at:now(),kind,text});
  S.autoEvents=S.autoEvents.slice(0,40);
  return true;
}
function checkRules(p,cfg){
  const m=moistureAt(p,now());
  if(m==null||m<0||m>100) return {ok:false,kind:"bloqueo",text:"Bloqueado: el sensor no da una lectura válida.",m};
  if(m>=cfg.threshold) return {ok:false,kind:"espera",text:`En espera: humedad ${m}% (riega por debajo de ${cfg.threshold}%).`,m,quiet:true};
  const last=waterings(p.id)[0];
  if(last&&now()-last.at<cfg.gapH*HOUR) return {ok:false,kind:"pausa",text:`Humedad ${m}%, pero el último riego fue hace menos de ${cfg.gapH} h.`,m};
  const n24=waterings(p.id).filter(l=>l.type==="auto"&&now()-l.at<DAY).length;
  if(n24>=cfg.maxDay) return {ok:false,kind:"limite",text:`Humedad ${m}%, pero ya alcanzó el máximo de ${cfg.maxDay} riego(s) en 24 h.`,m};
  return {ok:true,m};
}
function evaluateAutomation(force){
  if(!force&&now()-R.lastAutoEval<60e3) return; R.lastAutoEval=now();
  if(S.autoStopped) return;
  let changed=false;
  for(const p of S.plants){
    if(!S.auto[p.id]||!S.auto[p.id].on||!autoReady(p)) continue; const cfg=autoCfg(p);
    const r=checkRules(p,cfg);
    if(!r.ok){ if(!r.quiet&&addEvent(p,r.kind,r.text)) changed=true; continue; }
    const ml=clamp(cfg.ml,10,HARD_MAX_ML);
    if(cfg.confirm){
      if(!S.pending.find(x=>x.plantId===p.id)&&now()>cfg.snoozeUntil){ S.pending.push({id:uid(),plantId:p.id,ml,m:r.m,at:now()}); changed=true; }
      continue;
    }
    doWater(p,ml,"auto",`Riego automático: humedad ${r.m}% por debajo de ${cfg.threshold}%.`);
    addEvent(p,"riego",`Regó ${ml} ml (humedad ${r.m}%).`); changed=true;
  }
  if(changed) save();
}
function doWater(p,ml,type,text){
  const l={id:uid(),plantId:p.id,type:type||"riego",at:now(),ml};
  if(text) l.text=text;
  S.logs.push(l);
  S.pending=S.pending.filter(x=>x.plantId!==p.id);
  return l;
}

/* ───────── Planes y equipos ───────── */
// Los equipos instalados se conservan al bajar de plan: solo se ignoran mientras el plan no los incluya.
function sensorOn(id){ return S.plan>=3?S.sensors[id]:undefined; }
const roomOf = p=>(p.room||"").trim()||"Sin lugar";
function autoReady(p){ return S.plan>=4&&!!sensorOn(p.id)&&!!S.hw.pumps[roomOf(p)]; }

// Qué falta comprar para el plan n: un sensor por planta, un puente y, para riego, un kit por lugar de la casa.
function hwNeeds(n){
  const out=[]; if(n<3) return out;
  const plants=S.plants.filter(p=>!S.hw.skip[p.id]);
  const noSensor=plants.filter(p=>!S.sensors[p.id]);
  if(noSensor.length) out.push({k:"sensor",qty:noSensor.length,why:"Uno por planta: "+noSensor.map(p=>p.name).join(", ")});
  if(plants.length&&!S.hw.steps.hub) out.push({k:"hub",qty:1,why:"Uno para toda la casa"});
  if(n>=4){
    const rooms={}; plants.forEach(p=>{ const r=roomOf(p); if(!S.hw.pumps[r]) (rooms[r]=rooms[r]||[]).push(p); });
    const rs=Object.keys(rooms), np=rs.reduce((a,r)=>a+rooms[r].length,0);
    if(rs.length){
      const where=rs.map(r=>`${r} (${rooms[r].length})`).join(", ");
      out.push({k:"pump",qty:rs.length,why:"Una por lugar: "+where},{k:"tank",qty:rs.length,why:"Uno por bomba"},{k:"power",qty:rs.length,why:"Uno por bomba"},
        {k:"hose",qty:np*2,why:"Unos 2 m por planta"},{k:"drip",qty:np,why:"Uno por maceta"});
    }
  }
  return out.map(x=>Object.assign(x,HW[x.k],{lo:x.qty*HW[x.k].price[0],hi:x.qty*HW[x.k].price[1]}));
}
const setupPending = ()=>S.plan>=3&&hwNeeds(S.plan).length>0;

// Pasos de instalación pendientes (se guardan al empezar, para mostrarlos tachados al completarlos)
function installIds(n){
  const ids=[], plants=S.plants.filter(p=>!S.hw.skip[p.id]);
  if(n>=3&&plants.length){
    if(!S.hw.steps.hub) ids.push("hub");
    const ns=plants.filter(p=>!S.sensors[p.id]);
    if(ns.length&&!S.hw.steps.charge) ids.push("charge");
    ns.forEach(p=>ids.push("s:"+p.id));
  }
  if(n>=4){
    [...new Set(plants.map(roomOf))].filter(r=>!S.hw.pumps[r]).forEach(r=>ids.push("p:"+r));
    if(!S.hw.steps.rules||plants.some(p=>!S.auto[p.id])) ids.push("rules");
  }
  return ids;
}
function stepDone(id){
  if(id.startsWith("s:")) return !!S.sensors[id.slice(2)]||!plantById(id.slice(2));
  if(id.startsWith("p:")) return !!S.hw.pumps[id.slice(2)];
  return !!S.hw.steps[id];
}

const BUDGET_CAP={"1":1,"2":2,"4":4};
const qDone=k=>{ const v=R.quiz[k]; return Array.isArray(v)?v.length>0:!!v; };
function quizRec(){
  const q=R.quiz; if(!QUIZ.every(([k])=>qDone(k))) return null;
  const picked=QUIZ.flatMap(([k,,opts])=>{ const v=[].concat(q[k]); return opts.filter(o=>v.includes(o[0])); });
  if(!picked.length) return null;
  const score=[1,2,3,4].map(n=>picked.reduce((t,o)=>t+o[2][n-1],0));
  const lo=picked.reduce((t,o)=>t+Math.min(...o[2]),0), hi=picked.reduce((t,o)=>t+Math.max(...o[2]),0);
  const fit=score.map(x=>Math.round(100*(x-lo)/Math.max(1,hi-lo)));
  const best=arr=>arr.reduce((b,n)=>score[n-1]>score[b-1]?n:b);
  const n=best([1,2,3,4]);
  const why=picked.filter(o=>o[2][n-1]>=2).sort((x,y)=>y[2][n-1]-x[2][n-1]).slice(0,4).map(o=>o[3]);
  const cap=BUDGET_CAP[q.budget]||4;
  const alt=n>cap?best([1,2,3,4].filter(m=>m<=cap)):0;
  const up=!alt?[1,2,3,4].filter(m=>m>n&&score[n-1]-score[m-1]<=2).pop()||0:0;
  return {n,why,fit,alt,up};
}

function viewReady(){
  const n=S.plan;
  return `<div class="stack">${flowHead("ready","¡Todo listo!",`Tienes el ${planName(n)}. Esto es lo que puedes hacer en cada sección:`)}
    <section class="card">${FEATURES.map(([k,l,icn,min,desc])=>`<div class="insight" style="${min>n?"opacity:.55":""}"><div class="ic">${ic(min>n?"lock":icn,18)}</div><div><b>${l}</b><p>${min>n?`Disponible desde el plan ${min} · ${PLANS[min].name}.`:desc}</p></div></div>`).join("")}</section>
    <p class="tiny">Puedes cambiar de plan cuando quieras desde el botón «Plan ${n}» arriba. Tus plantas y tu diario se mantienen.</p></div>`;
}
function flowBar(){
  const step=S.flow?S.flow.step:"intro"; if(step==="intro") return "";
  const st=flowSteps(), first=st.indexOf(step)===0;
  const back=`<button class="btn btn-ghost" data-act="flow-back">${first&&S.flow.upgrade?"Ahora no":"Atrás"}</button>`;
  if(step==="plan") return back+`<button class="btn btn-primary" data-act="flow-next" ${R.pick?"":"disabled"}>${R.pick?"Seguir con plan "+R.pick:"Elige un plan"}</button>`;
  if(step==="plants") return back+`<button class="btn btn-primary" data-act="flow-next" ${S.plants.length?"":"disabled"}>${S.plants.length?(S.plan>=3?"Ver equipos":"Terminar"):"Agrega una planta"}</button>`;
  if(step==="devices") return back+`<button class="btn btn-primary" data-act="flow-next">${hwNeeds(S.plan).length?"Ya los tengo":"Continuar"}</button>`;
  if(step==="install"){ const left=(S.flow.install||[]).filter(id=>!stepDone(id)).length; return back+`<button class="btn btn-primary" data-act="flow-next" ${left?"disabled":""}>${left?`Faltan ${left} ${left===1?"paso":"pasos"}`:"Continuar"}</button>`; }
  return `<button class="btn btn-primary" data-act="flow-next">Ir a la app</button>`;
}

/* Pantalla de una función que no está en el plan actual */
function viewLocked(f){
  const n=f[3], P=PLANS[n];
  return `<div class="stack"><h1 class="page-title">${f[1]}</h1>
    <section class="card"><div class="row" style="gap:12px"><span class="pn" style="width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)">${ic("lock",20)}</span><div class="grow"><span class="eyebrow">Incluido desde el plan ${n}</span><h2 style="margin-top:2px">${P.name}</h2></div></div>
      <p style="margin-top:12px">${P.promise}</p>
      <ul class="small muted" style="margin:10px 0 0;padding-left:20px">${P.adds.map(a=>`<li>${a}</li>`).join("")}</ul>
      <div class="meta"><span class="tag ${n>=3?"warn":"green"}">${ic(n>=3?"sensor":"phone",14)}${P.hw}</span><span class="tag">${P.cost}</span><span class="tag">${P.setup}</span></div>
      <div class="stack" style="gap:8px;margin-top:16px"><button class="btn btn-primary btn-block" data-act="set-plan" data-n="${n}">Cambiar al plan ${n}</button><button class="btn btn-ghost btn-block" data-act="my-plan">Comparar planes</button></div></section>
    <p class="tiny">Tienes el ${planName(S.plan)}. Al cambiar, tus plantas y tu diario se mantienen${n>=3?"; te guiaremos para elegir e instalar los equipos":""}.</p></div>`;
}
function setupCard(){
  if(!setupPending()) return "";
  const items=hwNeeds(S.plan), s=items.find(x=>x.k==="sensor"), pmp=items.find(x=>x.k==="pump");
  const what=[s?`${s.qty} ${s.qty===1?"sensor":"sensores"}`:"",pmp?`${pmp.qty} ${pmp.qty===1?"kit":"kits"} de riego`:"",!s&&!pmp?"el puente Wi-Fi":""].filter(Boolean).join(" y ");
  return `<section class="card pending"><span class="tag pink">${planName(S.plan)}</span><h3 style="margin-top:8px">Falta instalar ${what}</h3>
    <p class="small muted" style="margin-top:4px">Mientras tanto, la app funciona con recordatorios por calendario.</p>
    <button class="btn btn-accent btn-sm" style="margin-top:12px" data-act="resume-setup">Ver equipos e instalar</button></section>`;
}

function viewHoy(){
  evaluateAutomation();
  const h=new Date().getHours();
  const greet=h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches";
  const items=S.plants.map(p=>({p,plan:waterPlan(p)}));
  const due=items.filter(i=>i.p.remind!==false&&(i.plan.status==="hoy"||i.plan.status==="atrasada"||i.plan.status==="sin-dato")).sort((a,b)=>a.plan.due-b.plan.due);
  const week=items.filter(i=>i.plan.status==="ok"&&i.plan.due<=7).sort((a,b)=>a.plan.due-b.plan.due);
  const alerts=sensorAlerts();
  const dateStr=new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
  let html=`<div class="stack">
    <div><p class="eyebrow">${esc(dateStr)}</p><h1 class="page-title">${greet}</h1></div>`;
  html+=setupCard()+pendingCards();
  if(!S.plants.length){
    html+=`<div class="card empty"><h3>Todavía no tienes plantas</h3><p class="muted">Agrega la primera para ver aquí qué necesita cada día.</p><button class="btn btn-primary" data-act="add-plant">${ic("plus",18)}Agregar planta</button></div>`;
  } else {
    html+=`<section class="card"><div class="section-h" style="margin:0 0 10px"><h2>Para hoy</h2><span class="tiny">${due.length} ${due.length===1?"tarea":"tareas"}</span></div>`;
    if(!due.length) html+=`<p class="muted">Nada pendiente. Tus plantas están al día.</p>`;
    else html+=due.map(({p,plan})=>`<div class="task">
        <button class="thumb" data-act="open-plant" data-id="${p.id}" aria-label="Ver ${esc(p.name)}">${thumbHTML(p)}</button>
        <div class="grow"><div class="t-name">${esc(p.name)}</div><div class="t-sub">${plan.status==="sin-dato"?"¿Cuándo la regaste? Registra el riego":"Regar ~"+plan.ml+" ml · "+(plan.status==="atrasada"?"tocaba "+inDays(plan.due):"toca hoy")}</div></div>
        <button class="btn btn-soft btn-sm" data-act="quick-water" data-id="${p.id}">${ic("drop",16)}Ya la regué</button>
      </div>`).join("");
    html+=`</section>`;
    if(alerts.length){
      html+=`<section class="card"><div class="section-h" style="margin:0 0 6px"><h2>Alertas de sensores</h2><span class="tag pink">Demo</span></div>`+
        alerts.map(a=>`<div class="insight ${a.lv}"><div class="ic">${ic("gauge",18)}</div><div><b>${esc(a.p.name)}: ${esc(a.t)}</b><p>${esc(a.w)}</p></div></div>`).join("")+`</section>`;
    }
    if(week.length){
      html+=`<section class="card flat"><div class="section-h" style="margin:0 0 10px"><h2>Esta semana</h2></div>`+
        week.map(({p,plan})=>`<div class="task"><button class="thumb" data-act="open-plant" data-id="${p.id}" aria-label="Ver ${esc(p.name)}">${thumbHTML(p)}</button><div class="grow"><div class="t-name">${esc(p.name)}</div><div class="t-sub">Riego ${inDays(plan.due)} · ${new Date(plan.next).toLocaleDateString("es",{weekday:"long"})}</div></div></div>`).join("")+`</section>`;
    }
    const tipP=S.plants[hash(new Date().toDateString())%S.plants.length];
    html+=`<section class="tip"><b>Consejo para ${esc(tipP.name)}:</b> ${esc(SP(tipP.speciesId).tip)}</section>`;
  }
  const nx=S.plan<4?S.plan+1:0;
  html+=`<section class="card flat"><div class="row" style="align-items:flex-start"><div class="grow"><span class="eyebrow">Tu plan</span><h3 style="margin-top:2px">${planName(S.plan)}</h3>
    <p class="small muted" style="margin-top:4px">${nx?`¿Quieres más ayuda? El plan ${nx} suma: ${PLANS[nx].adds[0].charAt(0).toLowerCase()+PLANS[nx].adds[0].slice(1)}.`:"Tienes todas las funciones."}</p></div><button class="btn btn-ghost btn-sm" data-act="my-plan">Cambiar</button></div></section>`;
  return html+`</div>`;
}

function pendingCards(){
  if(!S.pending.length||S.autoStopped||S.plan<4) return "";
  return S.pending.map(x=>{const p=plantById(x.plantId); if(!p) return "";
    return `<section class="card pending"><div class="row" style="align-items:flex-start"><div class="grow"><span class="tag pink">Demo · Riego automático</span><h3 style="margin-top:8px">¿Regar ${esc(p.name)} ahora?</h3><p class="small muted" style="margin-top:4px">El sensor marca ${x.m}% de humedad, por debajo de tu umbral. Se regarán ${x.ml} ml según tus reglas.</p></div></div>
    <div class="btn-row" style="margin-top:12px"><button class="btn btn-accent btn-sm" data-act="confirm-auto" data-id="${x.id}">${ic("drop",16)}Regar ${x.ml} ml</button><button class="btn btn-ghost btn-sm" data-act="snooze-auto" data-id="${x.id}">Ahora no</button></div></section>`;}).join("");
}

function viewPlantas(){
  if(R.plantId&&plantById(R.plantId)) return viewPlant(plantById(R.plantId));
  R.plantId=null;
  let html=`<div class="stack"><div class="section-h" style="margin:0"><h1 class="page-title">Mis plantas</h1><span class="tiny">${S.plants.length}</span></div>`;
  html+=`<div class="plant-grid">`+S.plants.map(p=>{const plan=waterPlan(p),sp=SP(p.speciesId);
    return `<button class="pcard" data-act="open-plant" data-id="${p.id}"><div class="pic">${thumbHTML(p)}${p.example?'<span class="tag pink">Ejemplo</span>':""}${sensorOn(p.id)?`<span class="sensor-dot" title="Sensor conectado">${ic("sensor",15)}</span>`:""}</div>
      <div class="body"><span class="nm">${esc(p.name)}</span><span class="sp">${esc(sp.id==="otra"?"Especie sin identificar":sp.name)} · ${esc(p.room||"")}</span><span>${statusTag(plan)}</span></div></button>`;}).join("")+
    `<button class="add-tile" data-act="add-plant">${ic("plus",26)}Agregar planta</button></div></div>`;
  return html;
}

  const confTag={alta:"ok",media:"green",baja:"pink"}[plan.conf];
  let html=`<div class="stack">
    <button class="back" data-act="close-plant">${ic("back",18)}Mis plantas</button>
    <div class="hero">${thumbHTML(p)}</div>
    <div><div class="row wrap" style="gap:8px">${statusTag(plan)}${p.example?'<span class="tag pink">Ejemplo</span>':""}</div>
      <h1 class="page-title" style="margin-top:8px">${esc(p.name)}</h1>
      <p class="muted">${[esc(sp.name),sp.id!=="otra"?`<i>${esc(sp.sci)}</i>`:"",esc((p.room||"").trim())].filter(Boolean).join(" · ")}</p></div>
    <div class="quick">
      <button data-act="water" data-id="${p.id}">${ic("drop",22)}Regar</button>
      <button data-act="note" data-id="${p.id}">${ic("note",22)}Nota</button>
      <button data-act="photo-log" data-id="${p.id}">${ic("camera",22)}Foto</button>
      <button data-act="ask-about" data-id="${p.id}">${ic("chat",22)}Preguntar</button>
    </div>
    <section class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-start"><span class="eyebrow">Próximo riego</span><span class="tag ${confTag}">Confianza ${plan.conf}</span></div>
      <div class="row" style="margin-top:8px;align-items:baseline;gap:10px"><span class="big-num">${plan.status==="sin-dato"?"Pendiente":plan.status==="espera"?"Puede esperar":inDays(plan.due).replace(/^./,c=>c.toUpperCase())}</span><span class="muted">~${plan.ml} ml</span></div>
      <p class="small muted" style="margin-top:6px">${plan.last?"Último riego: "+fmtRel(plan.last)+". ":""}Cada ${plan.days} días aprox.</p>
      <details class="why"><summary>¿Por qué?</summary><ul>${plan.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></details>
    </section>`;
  html+=`<section class="card"><div class="section-h" style="margin:0 0 4px"><h2>Recomendaciones</h2></div>`+
    (ins.length?ins.map(i=>`<div class="insight ${i.lv}"><div class="ic">${ic(i.ic,18)}</div><div><b>${esc(i.t)}</b><p>${esc(i.w)}</p></div></div>`).join(""):`<p class="muted small">Todo en orden según los datos que tenemos.</p>`)+
    `<p class="tiny" style="margin-top:8px">Recomendaciones calculadas por reglas a partir de la especie, la ubicación y tu historial. Orientan, no reemplazan revisar la planta.</p></section>`;
  if(sensorOn(p.id)) html+=sensorCard(p,true);
  else if(S.plan>=3) html+=`<section class="card flat row"><div class="grow"><b style="font-weight:500">Sin sensor</b><p class="small muted">${S.hw.skip[p.id]?"Elegiste no monitorear esta planta.":"Aún no instalas su sensor."}</p></div><button class="btn btn-soft btn-sm" data-act="install-sensor" data-id="${p.id}">Instalar</button></section>`;
  else html+=`<section class="card flat row"><div class="grow"><b style="font-weight:500">¿Cuándo regar, con exactitud?</b><p class="small muted">Con un sensor en la maceta sabrías la humedad real de la tierra. Desde el plan 3.</p></div><button class="btn btn-ghost btn-sm" data-act="my-plan">Ver planes</button></section>`;
  html+=`<section class="card flat"><div class="section-h" style="margin:0"><h2>Ficha de cuidados</h2></div>
    <dl class="facts">
      <div><dt>Luz ideal</dt><dd>${LIGHT[sp.ideal].label}</dd></div>
      <div><dt>Riego</dt><dd>Cada ${sp.water} días aprox.</dd></div>
      <div><dt>Humedad de la tierra</dt><dd>${sp.moist[0]}–${sp.moist[1]} %</dd></div>
      <div><dt>Temperatura</dt><dd>${sp.temp[0]}–${sp.temp[1]} °C</dd></div>
      <div><dt>Humedad ambiente</dt><dd>${sp.hum}</dd></div>
      <div><dt>Mascotas</dt><dd>${sp.pets===true?"Segura":sp.pets===false?"Tóxica":"Sin dato"}</dd></div>
      <div><dt>Dificultad</dt><dd>${sp.diff}</dd></div>
      <div><dt>Su lugar</dt><dd>Luz ${LIGHT[p.light].label.toLowerCase()} · maceta ${POT[p.pot].label.toLowerCase()}</dd></div>
    </dl><div class="tip"><b>Consejo:</b> ${esc(sp.tip)}</div></section>`;

function entryHTML(l){
  const map={riego:["drop","Riego"],auto:["drop","Riego automático"],nota:["note","Nota"],foto:["camera","Foto"],ia:["chat","Consejo del asistente"]};
  const [icn,lbl]=map[l.type]||["note","Registro"];
  const ph=l.photo?getPhoto(l.photo):null;
  return `<div class="entry ${l.type==="auto"?"auto":""}"><div class="ic">${ic(icn,16)}</div><div class="grow">
    <div class="when">${lbl} · ${fmtRel(l.at)}${l.ml?` · ${l.ml} ml`:""}</div>
    ${l.text?`<div class="txt">${esc(l.text)}</div>`:""}${ph?`<img src="${ph}" alt="Foto de la planta">`:""}</div>
    <button class="del" data-act="del-log" data-id="${l.id}" aria-label="Eliminar registro">${ic("x",16)}</button></div>`;
}

const LUX={baja:[50,500],media:[500,2000],alta:[2000,10000],directa:[10000,30000]}; // lux de día por nivel de luz
const SVARS={moist:"Humedad de la tierra",temp:"Temperatura",light:"Luz"};
const niceCeil=v=>{ const e=10**Math.floor(Math.log10(Math.max(v,1))); return Math.ceil(v/e)*e; };
function sensorCard(p,compact){
  const sp=SP(p.speciesId), t=now(), fault=S.sensors[p.id].fault, off=tt=>fault&&tt>=fault;
  const m=moistureAt(p,t), tc=off(t)?null:tempAt(p,t), lx=off(t)?null:lightAt(p,t);
  const k=R.chartVar[p.id]||"moist";
  const at={moist:tt=>moistureAt(p,tt),temp:tt=>off(tt)?null:tempAt(p,tt),light:tt=>off(tt)?null:lightAt(p,tt)}[k];
  const pts=[]; for(let i=168;i>=0;i--){const tt=t-i*HOUR; pts.push({t:tt,v:at(tt)});}
  const vals=pts.map(q=>q.v).filter(v=>v!=null);
  let band,sc,cur,pos,ends,ideal;
  if(k==="moist"){ band=sp.moist; cur=m; sc={min:0,max:100,ticks:[0,50,100],fmt:v=>v};
    pos=v=>v; ends=["0 %","100 %"]; ideal=`Ideal ${band[0]}–${band[1]} %`; }
  else if(k==="temp"){ band=sp.temp; cur=tc;
    const lo=Math.floor(Math.min(band[0],...vals)-2), hi=Math.ceil(Math.max(band[1],...vals)+2);
    sc={min:lo,max:hi,ticks:[lo,Math.round((lo+hi)/2),hi],fmt:v=>v+"°"};
    pos=v=>(v-5)/30*100; ends=["5 °C","35 °C"]; ideal=`Ideal ${band[0]}–${band[1]} °C`; }
  else { band=LUX[sp.ideal]||LUX.media; cur=lx;
    const top=niceCeil(Math.max(band[0]*1.3,...vals)*1.1);
    sc={min:0,max:top,ticks:[0,top/2,top],fmt:fmtLux};
    pos=v=>v<=10?0:(Math.log10(v)-1)/(Math.log10(30000)-1)*100; ends=["Oscuro","Sol pleno"]; ideal=`Ideal de día ${fmtLux(band[0])}–${fmtLux(band[1])} lux`; }
  const pc=v=>clamp(pos(v),0,100);
  const st = m==null?`<span class="tag bad">Sin lectura</span>`:m<sp.moist[0]?`<span class="tag bad">Seco</span>`:m>sp.moist[1]+10?`<span class="tag warn">Muy húmedo</span>`:`<span class="tag ok">Bien</span>`;
  const tile=(key,val,unit)=>`<button class="metric${k===key?" on":""}" data-act="chart-var" data-id="${p.id}" data-v="${key}" aria-pressed="${k===key}"><span class="lbl">${SVARS[key]}</span><span class="val">${val==null?"—":val}<small> ${unit}</small></span></button>`;
  return `<section class="card">
    <div class="row" style="justify-content:space-between"><div class="row" style="gap:10px">${compact?"":`<button class="thumb" style="width:40px;height:40px;border-radius:12px" data-act="open-plant" data-id="${p.id}" aria-label="Ver ${esc(p.name)}">${thumbHTML(p)}</button>`}<div><b style="font-weight:500">${compact?"Sensor":esc(p.name)}</b><div class="tiny">${compact?"Datos simulados":esc(sp.name)}</div></div></div><div class="row" style="gap:6px"><span class="tag pink">Demo</span>${st}</div></div>
    <div class="metrics" role="group" aria-label="Elige qué ver en la gráfica">
      ${tile("moist",m,"%")}${tile("temp",tc==null?null:String(tc).replace(".",","),"°C")}${tile("light",lx==null?null:fmtLux(lx),"lux")}
    </div>
    <p class="tiny" style="margin-top:6px">Toca un dato para ver su gráfica.</p>
    <div class="range" aria-label="${SVARS[k]} actual frente al rango ideal"><div class="ideal" style="left:${pc(band[0])}%;width:${pc(band[1])-pc(band[0])}%"></div>${cur!=null?`<div class="mk" style="left:calc(${pc(cur)}% - 2px)"></div>`:""}</div>
    <div class="row tiny" style="justify-content:space-between;margin-top:4px"><span>${ends[0]}</span><span>${ideal}</span><span>${ends[1]}</span></div>
    ${lineChart(pts,band,{...sc,label:SVARS[k].toLowerCase()})}
    <div class="row" style="justify-content:space-between;margin-top:6px;align-items:flex-start"><span class="tiny">${SVARS[k]} · últimos 7 días${k==="light"?" · de noche baja a 0, es normal":""}</span>
      <button class="link small" style="white-space:nowrap" data-act="toggle-fault" data-id="${p.id}">${fault?"Restablecer sensor":"Simular falla"}</button></div>
  </section>`;
}
function lineChart(pts,band,sc){
  const W=320,H=130,L=32,Rr=8,T=8,B=20, iw=W-L-Rr, ih=H-T-B;
  const t0=pts[0].t,t1=pts[pts.length-1].t, lo=sc.min, hi=sc.max;
  const x=t=>L+(t-t0)/(t1-t0)*iw, y=v=>T+(1-(clamp(v,lo,hi)-lo)/(hi-lo))*ih;
  let d="",area="",started=false,lastPt=null;
  for(const p of pts){ if(p.v==null){started=false;continue;} const X=x(p.t).toFixed(1),Y=y(p.v).toFixed(1); d+=(started?"L":"M")+X+" "+Y; started=true; lastPt=[X,Y]; }
  const valid=pts.filter(p=>p.v!=null);
  if(valid.length>1) area=`M${x(valid[0].t).toFixed(1)} ${y(lo)}`+valid.map(p=>`L${x(p.t).toFixed(1)} ${y(p.v).toFixed(1)}`).join("")+`L${x(valid[valid.length-1].t).toFixed(1)} ${y(lo)}Z`;
  const grid=sc.ticks.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end">${sc.fmt(v)}</text>`).join("");
  let xl=""; for(let i=0;i<7;i++){const tt=sod(t1)-i*DAY; if(tt<t0)break; const lbl=new Date(tt).toLocaleDateString("es",{weekday:"narrow"}); xl+=`<text x="${x(tt).toFixed(1)}" y="${H-5}" text-anchor="middle">${lbl.toUpperCase()}</text>`;}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de ${sc.label} en los últimos 7 días">
    <rect x="${L}" y="${y(band[1])}" width="${iw}" height="${Math.max(0,y(band[0])-y(band[1]))}" fill="var(--primary-soft)"/>${grid}
    ${area?`<path d="${area}" fill="var(--olive)" fill-opacity=".14"/>`:""}<path d="${d}" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linejoin="round"/>

function msgHTML(t,i,ctx){

function buildContext(ctx){
  const rules=`Eres el asistente de cuidado de plantas de una app (versión de prueba). Responde en español neutro, en 120 palabras o menos, con tono cálido y práctico. Sin títulos ni markdown; usa frases cortas o una lista simple con guiones si ayuda.
Reglas: explica brevemente por qué recomiendas cada cosa. Si los datos no bastan, dilo y pide el dato que falte (por ejemplo una foto o cómo está la tierra al tacto). No des diagnósticos con certeza. Nunca digas que activaste el riego ni ningún dispositivo: el riego automático lo controlan reglas fijas que configura la persona. Las lecturas de sensores son simuladas (demo).`;
  if(ctx==="general"){
    const list=S.plants.map(p=>`- ${p.name}: ${SP(p.speciesId).name} (${SP(p.speciesId).sci}), ${p.room||"sin lugar"}, luz ${LIGHT[p.light].label.toLowerCase()}`).join("\n")||"(todavía no tiene plantas registradas)";
    return rules+`\n\nPlantas de la persona:\n${list}\n${S.settings.pets?"Tiene mascotas en casa.":""}`;
  }
  const p=plantById(ctx), sp=SP(p.speciesId), plan=waterPlan(p);
  const hist=logsOf(p.id).slice(0,10).map(l=>`- ${fmtShort(l.at)}: ${l.type}${l.ml?" "+l.ml+" ml":""}${l.text?" — "+l.text.slice(0,200):""}`).join("\n")||"(sin registros)";
  let sensor="Sin sensor conectado.";
  if(sensorOn(p.id)){ const m=moistureAt(p,now()); sensor=`Sensor (simulado): humedad de la tierra ${m==null?"sin lectura":m+"%"}, temperatura ${tempAt(p,now())} °C, luz ${lightAt(p,now())} lux.`; }
  return rules+`\n\nPlanta: "${p.name}". Especie: ${sp.id==="otra"?"desconocida (la persona no sabe cuál es)":sp.name+" ("+sp.sci+")"}. Lugar: ${p.room||"—"}, luz ${LIGHT[p.light].label.toLowerCase()}, maceta ${POT[p.pot].label.toLowerCase()}.
Cuidados de referencia: riego cada ~${sp.water} días, humedad de la tierra ideal ${sp.moist[0]}–${sp.moist[1]}%, luz ideal ${LIGHT[sp.ideal].label.toLowerCase()}, ${sp.temp[0]}–${sp.temp[1]} °C. ${S.settings.pets?"Hay mascotas en casa.":""}
Cálculo de la app: próximo riego ${plan.status==="sin-dato"?"sin datos":inDays(plan.due)}, ~${plan.ml} ml, intervalo ajustado ${plan.days} días.
${sensor}
Historial reciente:\n${hist}`;
}
const SAMPLE_ERR={not_granted:"No diste permiso para usar Claude en esta app. Las recomendaciones por reglas siguen disponibles.",sampling_disabled:"El asistente no está disponible para tu cuenta.",rate_limited:"Muchas preguntas seguidas. Espera un momento y vuelve a intentar.",session_expired:"Tu sesión expiró. Vuelve a iniciar sesión y reintenta.",image_rejected:"No pude usar esa foto. Prueba con otra en formato JPG o PNG.",refused:"No puedo responder esa pregunta. Intenta formularla de otra manera.",prompt_too_large:"La conversación es muy larga. Cambia de planta o recarga para empezar de nuevo.",images_unavailable:"En esta vista no se pueden enviar fotos al asistente.",network:"No pude conectar con OpenAI. Revisa tu conexión e intenta de nuevo.",bad_key:"La API key de OpenAI no es válida o no tiene saldo. Revísala en Ajustes.",bad_model:`El modelo ${AI_MODEL} no está disponible para tu API key.`,bad_json:"La respuesta llegó con un formato inesperado. Intenta de nuevo.",empty:"OpenAI respondió vacío. Intenta de nuevo."};
async function sendChat(text){
  text=(text||"").trim(); if(!text||R.chat.busy) return;
  if(!R.sample){toast("El asistente aún se está cargando.");return;}
  const ctx=R.chat.ctx, turns=(R.chat.turns[ctx]=R.chat.turns[ctx]||[]);
  const att=R.chat.attach; R.chat.attach=null; R.chat.draft="";
  turns.push({role:"user",content:text,img:att?att.url:null});
  const ai={role:"assistant",content:"",pending:true}; turns.push(ai);
  if(!S.usedAssistant){S.usedAssistant=true;save();}
  R.chat.busy=true; R.chat.ctl=new AbortController(); render(); scrollChat();
  const hist=turns.slice(0,-1).filter(t=>t.content&&!t.err).slice(-12).map(t=>({role:t.role,content:t.content}));
  while(hist.length&&hist[0].role!=="user") hist.shift();
  const input=[{role:"user",content:buildContext(ctx)},...hist];
  const idx=turns.length-1, setBubble=s=>{const el=document.getElementById(`m-${ctx}-${idx}`); if(el) el.textContent=s;};
  setBubble("Pensando…");
  try{
    const opts={cache:false,signal:R.chat.ctl.signal,onText:({text})=>{ai.content=text;setBubble(text);scrollChat();}};
    if(att&&R.imgOK) opts.images=[att.blob];
    const res=await R.sample(input,opts);
    ai.content=res.text; if(res.truncated) ai.err="La respuesta quedó incompleta.";
  }catch(e){
    ai.content=(e&&e.text)||"";
    if(e&&e.code==="cancelled"){ if(!ai.content) ai.content="(Respuesta detenida)"; }
    else { ai.err=SAMPLE_ERR[e&&e.code]||"No pude responder ahora. Intenta de nuevo en un momento."; if(e&&(e.code==="not_granted"||e.code==="sampling_disabled")) R.sample=null; if(att&&e&&e.code==="image_rejected") R.imgOK=false; }
  }
  ai.pending=false; R.chat.busy=false; R.chat.ctl=null; render(); scrollChat();
}
function scrollChat(){ const m=$("#msgs"); if(m) m.lastElementChild?.scrollIntoView({block:"nearest"}); }

function go(tab){ R.tab=tab; if(tab!=="plantas") R.plantId=null; render(); window.scrollTo(0,0); }
function startSetup(){ closeSheet(); S.flow={step:"devices",upgrade:true,prev:S.plan}; save(); R.plantId=null; render(); window.scrollTo(0,0); }
function finishFlow(){ S.flow=null; S.onboarded=true; save(); R.plantId=null; go("hoy"); }
function startAddPlant(){ openSheet({type:"species",q:"",data:{},photo:null}); }

function loadExamples(){
  const t=now(), mk=(name,speciesId,room,light,pot,waterAgo,notes)=>{
    const p={id:uid(),name,speciesId,room,light,pot,createdAt:t-30*DAY,remind:true,example:true};
    S.plants.push(p);
    waterAgo.forEach(d=>S.logs.push({id:uid(),plantId:p.id,type:"riego",at:t-d*DAY-3*HOUR,ml:doseFor(p)}));
    (notes||[]).forEach(([d,text])=>S.logs.push({id:uid(),plantId:p.id,type:"nota",at:t-d*DAY,text}));
    return p;
  };
  mk("Pepa","poto","Sala","media","mediana",[7,14,21],[[3,"Le salió una hoja nueva"]]);
  const lola=mk("Lola","monstera","Estudio","baja","grande",[4,9,13,17],[[2,"Dos hojas de abajo se pusieron amarillas"]]);
  mk("Ramón","sansevieria","Dormitorio","baja","pequena",[25],[]);
  const fromIntro=!S.onboarded&&!S.flow, inPlants=!!S.flow&&S.flow.step==="plants";
  if(inPlants){ save(); closeSheet(); render(); toast("Agregamos 3 plantas de ejemplo."); return; }
  // Fuera del recorrido, los ejemplos llegan con sus equipos ya instalados según el plan
  if(fromIntro) S.plan=4;
  const ex=S.plants.filter(p=>p.example);
  if(S.plan>=3){ ex.forEach(p=>{ S.sensors[p.id]=S.sensors[p.id]||{at:t}; }); S.hw.steps.hub=S.hw.steps.charge=true; }
  if(S.plan>=4){ ex.forEach(p=>{ S.hw.pumps[roomOf(p)]=true; const c=autoCfg(p); c.on=true; }); S.hw.steps.rules=true; }
  S.onboarded=true; S.flow=null; save(); closeSheet(); go("hoy");
  toast(fromIntro?"Cargamos 3 plantas de ejemplo con el plan 4, que incluye todo. Cámbialo con el botón «Plan 4».":"Cargamos 3 plantas de ejemplo.");
}

let toastTimer=null;
function toast(msg,undo){
  const root=$("#toast-root");
  root.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?`<button data-act="undo">Deshacer</button>`:""}</div>`;
  R.undo=undo||null; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{root.innerHTML="";R.undo=null;},4200);
}

async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const max=800, k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const dataUrl=c.toDataURL("image/jpeg",.72);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.8));
    return {dataUrl,blob};
  } finally { URL.revokeObjectURL(url); }
}
